$kind: http-request
name: '07 - Delete User'
order: 7000
method: DELETE
url: '{{baseUrl}}/api/users/{{createdUserId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 204", function () {
          pm.response.to.have.status(204);
      });

      pm.test("Response body is empty", function () {
          pm.expect(pm.response.text()).to.equal("");
      });
