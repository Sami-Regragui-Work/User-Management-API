$kind: http-request
name: '400 - Validation Errors'
order: 8000
method: POST
url: '{{baseUrl}}/api/users'
auth:
  type: basic
  credentials:
    - key: username
      value: '{{adminEmail}}'
    - key: password
      value: '{{adminPassword}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "",
      "email": "bad",
      "password": "short",
      "role": "USER"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 400", function () {
          pm.response.to.have.status(400);
      });

      pm.test("Error response body has required properties", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("timestamp");
          pm.expect(json).to.have.property("status");
          pm.expect(json).to.have.property("error");
          pm.expect(json).to.have.property("message");
          pm.expect(json).to.have.property("path");
          pm.expect(json.status).to.equal(400);
      });

      pm.test("fieldErrors has name, email and password properties", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("fieldErrors");
          pm.expect(json.fieldErrors).to.have.property("name");
          pm.expect(json.fieldErrors).to.have.property("email");
          pm.expect(json.fieldErrors).to.have.property("password");
      });
