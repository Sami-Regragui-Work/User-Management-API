$kind: http-request
name: '400 - Malformed JSON'
order: 9000
method: POST
url: '{{baseUrl}}/api/users'
auth:
  type: basic
  credentials:
    - key: username
      value: '{{adminEmail}}'
    - key: password
      value: '{{adminPassword}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: text
  content: '{ not json'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 400", function () {
          pm.response.to.have.status(400);
      });

      pm.test("Error response body has required properties", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("timestamp");
          pm.expect(json).to.have.property("status");
          pm.expect(json).to.have.property("error");
          pm.expect(json).to.have.property("message");
          pm.expect(json).to.have.property("path");
          pm.expect(json.status).to.equal(400);
      });

      pm.test("Message is 'Malformed request body'", function () {
          const json = pm.response.json();
          pm.expect(json.message).to.equal("Malformed request body");
      });
