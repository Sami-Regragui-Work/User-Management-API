$kind: http-request
name: '400 - Wrong Current Password'
order: 12000
method: PATCH
url: '{{baseUrl}}/api/users/me/password'
auth:
  type: basic
  credentials:
    - key: username
      value: '{{user1Email}}'
    - key: password
      value: '{{user1Password}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "wrong",
      "newPassword": "newPassword1"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 400", function () {
          pm.response.to.have.status(400);
      });

      pm.test("Error response body has required properties", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("timestamp");
          pm.expect(json).to.have.property("status");
          pm.expect(json).to.have.property("error");
          pm.expect(json).to.have.property("message");
          pm.expect(json).to.have.property("path");
          pm.expect(json.status).to.equal(400);
      });
