$kind: http-request
name: '404 - Endpoint Not Found'
order: 15000
method: GET
url: '{{baseUrl}}/api/nothing-here'
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 404", function () {
          pm.response.to.have.status(404);
      });

      pm.test("Error response body has required properties", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("timestamp");
          pm.expect(json).to.have.property("status");
          pm.expect(json).to.have.property("error");
          pm.expect(json).to.have.property("message");
          pm.expect(json).to.have.property("path");
          pm.expect(json.status).to.equal(404);
      });

      pm.test("Message is 'Endpoint not found'", function () {
          const json = pm.response.json();
          pm.expect(json.message).to.equal("Endpoint not found");
      });
