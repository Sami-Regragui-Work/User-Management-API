$kind: collection
description: |-
  REST API collection for User Management, secured with HTTP Basic Auth.

  **Run order:** Execute folders in order — "1 - Admin" first, then "2 - Me", then "3 - Errors".
  The collection is safe to re-run as many times as needed until the application is restarted.
variables:
  baseUrl: http://localhost:8080/user-management
  adminEmail: admin@example.com
  adminPassword: admin@example.com
  user1Email: user1@example.com
  user1Password: user1@example.com
  user2Email: user2@example.com
  user2Password: user2@example.com
  deactEmail: d_user@example.com
  deactPassword: d_user@example.com
  createdUserId: ""
