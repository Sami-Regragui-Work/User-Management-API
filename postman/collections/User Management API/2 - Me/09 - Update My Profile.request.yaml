$kind: http-request
name: '09 - Update My Profile'
order: 2000
method: PUT
url: '{{baseUrl}}/api/users/me'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "User1 Updated",
      "email": "user1@example.com"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
