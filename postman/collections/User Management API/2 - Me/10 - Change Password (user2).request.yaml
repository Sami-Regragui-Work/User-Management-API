$kind: http-request
name: '10 - Change Password (user2)'
order: 3000
method: PATCH
url: '{{baseUrl}}/api/users/me/password'
auth:
  type: basic
  credentials:
    - key: username
      value: '{{user2Email}}'
    - key: password
      value: '{{user2Password}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "user2@example.com",
      "newPassword": "NewPass12345"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 204", function () {
          pm.response.to.have.status(204);
      });
